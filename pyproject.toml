[project]
name = "talaria"
version = "0.1.0"
description = "Cleaning and evaluating the Virtue Foundation healthcare facilities dataset on Databricks."
requires-python = ">=3.11,<3.13"
# No runtime dependencies: Databricks provides pyspark on the cluster.
dependencies = []

[dependency-groups]
# Local development only: a laptop Spark session for the unit tests.
dev = [
    "pyspark==3.5.*",
    "pytest>=8",
    {include-group = "app"},
]
# The care finder app (spec #26); app/requirements.txt lists the same packages for the deploy.
app = [
    "databricks-sdk>=0.40",
    "h3>=4,<5",
    "streamlit>=1.40",
    "pydeck>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
